services:
  postgres:
    image: 'postgres:17'
    container_name: booking-postgres
    environment:
      - 'POSTGRES_DB=postgres'
      - 'POSTGRES_PASSWORD=postgres'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5432:5432'
    volumes:
      - booking-postgres-data:/var/lib/postgresql/data

volumes:
  booking-postgres-data: